name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out application
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out landing page
        uses: actions/checkout@v6
        with:
          ref: refs/heads/week14
          path: landing
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: checkmudrets-pwa/package-lock.json
      - name: Build PWA
        working-directory: checkmudrets-pwa
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Assemble Pages artifact
        shell: bash
        run: |
          site="$RUNNER_TEMP/checkmudrets-pages"
          mkdir "$site"
          git -C landing archive HEAD:docs | tar -x -C "$site"
          test -f "$site/index.html"
          mkdir "$site/app"
          cp -R checkmudrets-pwa/dist/. "$site/app/"
          test -f "$site/app/index.html"
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/checkmudrets-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish site
        id: publish
        uses: actions/deploy-pages@v4
